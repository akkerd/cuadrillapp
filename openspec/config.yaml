schema: spec-driven

context: |
  Language: en
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords as they are.

  Product: Cuadrillapp, a mobile PWA for voting contests among friends (rooms with a
  code, emoji + name, categories, 0-10 scores in 0.25 steps, leagues with a ranking).
  Personal test project, not production: favour simplicity.

  Stack (polyglot monorepo: a uv project for Python + a pnpm workspace for the frontend):
  - apps/server: Python 3.14 managed with uv. FastAPI (ASGI) + python-socketio
    (AsyncServer in ASGI mode) served by Uvicorn with 1 worker. Pydantic v2 for
    validation and for the protocol contract; pydantic-settings for configuration.
    Pure domain (dataclasses, no I/O) in `cuadrillapp.domain`.
  - apps/web: React 19 + Vite + TypeScript, Tailwind CSS v4, Motion, lucide-react,
    vite-plugin-pwa, socket.io-client.
  - packages/protocol: TypeScript types GENERATED from the Pydantic models (JSON
    Schema) and FastAPI's OpenAPI. Never edited by hand (`make gen`).
  - e2e: Playwright (TypeScript) against the production build.
  - Persistence (leagues/ranking only): SQLAlchemy 2.0 async + Alembic. Neon Postgres
    in production, SQLite in development/tests, a Postgres service container in CI.
    Auth: Authlib (Google OIDC) + a signed session cookie.
  - Hosting: one Docker image (web built with Node + Python runtime) as a single
    Render web service (serves API, sockets and static files).

  Conventions:
  - Everything in the repository is written in English: code, comments, docs, specs,
    commits and pull requests. The only exception is player-facing UI copy, which
    lives in apps/web/src/copy.ts (currently Spanish).
  - Buttons: an icon plus at most 1-2 short words; no long sentences.
  - The server is the authority: the client sends commands and renders snapshots.
  - Python: Ruff (lint + format), mypy strict, pytest + pytest-asyncio.
    Web: Biome, tsc, Vitest.
  - `make verify` = gen-check + lint + typecheck + tests (Python and web) + build + e2e.
  - Never push directly to main: branch + PR + green CI. Main deploys itself.

rules:
  proposal:
    - Always state what is out of scope.
  specs:
    - Describe observable behaviour; no library names in specs.
  tasks:
    - Small tasks (one session each), each with its own concrete verification.
    - Every group includes its own tests; never leave tests for the end.
